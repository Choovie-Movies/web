name: Auto Label PR

on:
  pull_request:
    types: [opened, synchronize, review_requested, review_request_removed, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: write
  contents: read

jobs:
  label-by-changes:
    name: 🏷️ Label by changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check changed files and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            // Получаем список изменённых файлов в PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const changedPaths = files.map(f => f.filename);
            
            // Определяем лейблы на основе изменённых файлов
            const labelsToAdd = [];
            let hasFrontend = false;
            let hasBackend = false;
            
            // Проверяем фронтенд (HTML, CSS, JS, изображения)
            for (const path of changedPaths) {
              if (path.match(/\.(html|css|js)$/i) || 
                  path.match(/^(js|css|fonts|img|assets)\//) ||
                  path === 'index.html' || 
                  path === 'style.css') {
                hasFrontend = true;
              }
              // Проверяем бэкенд (Go файлы)
              if (path.match(/\.(go)$/i) ||
                  path.match(/^(cmd|internal|pkg|api)\//) ||
                  path === 'go.mod' || 
                  path === 'go.sum') {
                hasBackend = true;
              }
            }
            
            if (hasFrontend) labelsToAdd.push('frontend');
            if (hasBackend) labelsToAdd.push('backend');
            
            // Если ни один лейбл не определён, ставим 'frontend' по умолчанию
            if (labelsToAdd.length === 0) {
              labelsToAdd.push('frontend');
            }
            
            // Получаем текущие лейблы PR
            const { data: currentPR } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const currentLabels = currentPR.labels.map(l => l.name);
            
            // Удаляем старые лейблы frontend/backend
            const labelsToRemove = currentLabels.filter(
              l => (l === 'frontend' || l === 'backend') && !labelsToAdd.includes(l)
            );
            
            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label,
              });
            }
            
            // Добавляем новые лейблы
            const labelsToAddNew = labelsToAdd.filter(l => !currentLabels.includes(l));
            if (labelsToAddNew.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToAddNew,
              });
            }
            
            console.log(`✅ Labels added: ${labelsToAdd.join(', ')}`);

  label-need-to-fix:
    name: 🏷️ Label 'need to fix' on changes requested
    runs-on: ubuntu-latest
    steps:
      - name: Add 'need to fix' when review requests changes
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const review = context.payload.review;
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            
            if (!prNumber) {
              console.log('No PR number found');
              return;
            }
            
            let shouldAddFixLabel = false;
            let shouldRemoveFixLabel = false;
            
            // При событии review
            if (eventName === 'pull_request_review') {
              // Если ревьюер запросил изменения
              if (review?.state === 'changes_requested') {
                shouldAddFixLabel = true;
                console.log('Changes requested - adding need to fix label');
              }
              // Если ревью одобрен
              if (review?.state === 'approved') {
                // Проверяем, есть ли ещё active changes_requested ревью
                const { data: reviews } = await github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                
                const hasChangesRequested = reviews.some(r => r.state === 'CHANGES_REQUESTED');
                if (!hasChangesRequested) {
                  shouldRemoveFixLabel = true;
                  console.log('No pending changes requested - removing need to fix label');
                }
              }
            }
            
            // При новом коммите или открытии PR - убираем need to fix
            if (eventName === 'pull_request' && 
                (context.payload.action === 'synchronize' || context.payload.action === 'opened')) {
              shouldRemoveFixLabel = true;
              console.log('New commits or PR opened - removing need to fix label');
            }
            
            // Применяем изменения
            if (shouldAddFixLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['need to fix'],
              });
            }
            
            if (shouldRemoveFixLabel) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'need to fix',
                });
                console.log('✅ Removed need to fix label');
              } catch (error) {
                if (error.status !== 404) {
                  console.log('Label not found or already removed');
                }
              }
            }

  label-need-to-check:
    name: 🏷️ Label 'need to check' on new commits
    runs-on: ubuntu-latest
    steps:
      - name: Add 'need to check' on new commits or opened PR
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            
            if (!prNumber) {
              console.log('No PR number found');
              return;
            }
            
            let shouldAddCheckLabel = false;
            let shouldRemoveCheckLabel = false;
            
            // При новом коммите или открытии PR добавляем лейбл
            if (eventName === 'pull_request') {
              const action = context.payload.action;
              if (action === 'synchronize' || action === 'opened') {
                shouldAddCheckLabel = true;
                console.log('New commits or PR opened - adding need to check label');
              }
            }
            
            // При получении ревью (любого) убираем лейбл need to check
            if (eventName === 'pull_request_review') {
              shouldRemoveCheckLabel = true;
              console.log('Review received - removing need to check label');
            }
            
            // Применяем изменения
            if (shouldAddCheckLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['need to check'],
              });
            }
            
            if (shouldRemoveCheckLabel) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'need to check',
                });
                console.log('✅ Removed need to check label');
              } catch (error) {
                if (error.status !== 404) {
                  console.log('Label not found or already removed');
                }
              }
            }