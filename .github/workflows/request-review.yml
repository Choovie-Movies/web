name: Auto Request Review on PR

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check if reviewers already assigned
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Получаем текущих ревьюеров
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const currentReviewers = pr.requested_reviewers.map(r => r.login);
            const targetReviewers = ['LeeFoS6092', 'WenceNK'];
            
            // Проверяем, есть ли уже назначенные ревьюеры
            const hasReviewers = targetReviewers.some(r => currentReviewers.includes(r));
            
            console.log(`Current reviewers: ${currentReviewers.join(', ') || 'none'}`);
            console.log(`Target reviewers: ${targetReviewers.join(', ')}`);
            console.log(`Has any reviewer already assigned? ${hasReviewers}`);
            
            return { hasReviewers, currentReviewers, targetReviewers };
      
      - name: Request reviewers if none assigned
        if: steps.check.outputs.result.hasReviewers == false
        uses: actions/github-script@v7
        with:
          script: |
            const { targetReviewers } = JSON.parse(`${{ steps.check.outputs.result }}`);
            
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: targetReviewers,
            });
            
            console.log(`✅ Requested review from: ${targetReviewers.join(', ')}`);
      
      - name: Log skip reason
        if: steps.check.outputs.result.hasReviewers == true
        run: |
          echo "ℹ️ Reviewers already assigned, skipping auto-request"
