# .pre-commit-config.yaml
repos:
  # 1. Общие проверки: конец файла, пробелы, yaml и т.д.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace        # убирает лишние пробелы в конце строк
      - id: end-of-file-fixer          # добавляет пустую строку в конце файла
      - id: check-yaml                 # проверяет yaml файлы (твой конфиг)
      - id: check-added-large-files    # не даёт закоммитить большие файлы (>500KB)
        args: ['--maxkb=500']
      - id: check-merge-conflict       # проверяет, нет ли незакрытых конфликтов слияния
      - id: check-case-conflict        # проверяет конфликты регистров в именах файлов

  # 2. Проверка HTML (только синтаксис)
  - repo: https://github.com/html-validate/html-validate-pre-commit
    rev: v4.0.0
    hooks:
      - id: html-validate
        files: \.html$
        args: ['--root', '.']

  # 3. Проверка CSS (стиль и ошибки)
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.16.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==23.12.1]
        files: \.css$
        args: ['--skip-errors']

  # 4. Проверка JavaScript (ESLint)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0-alpha.2
    hooks:
      - id: eslint
        files: \.js$
        additional_dependencies:
          - eslint@8.57.0
          - eslint-config-google
        args: ['--fix', '--max-warnings=0']

  # 5. Проверка форматирования (prettier)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(html|css|js|json|yaml)$
        args: ['--write']