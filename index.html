<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choovie - Выбери свой вечер</title>

    <style>
      body,
      html {
        background: #0f111a;
        margin: 0;
        padding: 0;
        max-width: 100%;
        overflow-x: hidden;
        position: relative;
      }

      .header__logo a {
        display: flex;
        align-items: center;
        color: white;
        font-size: 2rem;
        font-weight: 700;
        text-decoration: none;
        line-height: 0.9;
        text-transform: lowercase;
        letter-spacing: 0.1rem;
        gap: 0.15rem;
      }

      .header__logo a span {
        display: block;
        height: 24px;
      }

      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
      }

      .container {
        width: 100%;
        max-width: calc(100% - 40px);
        margin: 0 auto;
      }

      .header--sidebar {
        position: fixed;
        left: 100vw;
      }

      .header--burger span {
        width: 30px;
        height: 4px;
        border-radius: 5px;
        background: white;
        display: block;
        position: relative;
      }

      .header--burger span:after {
        position: absolute;
        top: 10px;
        left: 0;
        width: 30px;
        height: 4px;
        border-radius: 5px;
        background: white;
        content: "";
      }

      .header--burger span:before {
        position: absolute;
        top: -10px;
        left: 0;
        width: 30px;
        height: 4px;
        border-radius: 5px;
        background: white;
        content: "";
      }

      .features {
        overflow: hidden;
        padding: 30px 0;
      }

      .features__title {
        text-align: center;
        color: #fff;
        font-size: 1.125rem;
        font-weight: 600;
        min-height: 30px;
        margin-bottom: 12px;
        transition: opacity 0.2s ease;
      }

      .features-slider {
        overflow: visible;
      }

      .swiper-slide {
        transition: transform 0.35s ease;
      }

      .slide-card {
        aspect-ratio: 0.93;
        border-radius: 15px;
        overflow: hidden;
        background: #232632;
        transform: scale(0.9);
        transition: transform 0.35s ease;
      }

      .swiper-slide-active .slide-card {
        transform: scale(1);
      }

      .slide-card img,
      .slide-card video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .intro--title {
        font-size: 2.25rem;
        font-weight: 700;
        margin: 0;
        color: white;
        text-align: center;
      }

      .intro--title span {
        color: #3366ff;
      }

      .section--intro {
        padding-top: 90px;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 60px;
        background: #0f111a;
      }

      .intro--subtitle {
        margin-top: 10px;
        margin-bottom: 0;
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        white-space: nowrap;
      }

      .features__title {
        text-align: center;
        font-weight: 600;
        color: white;
        font-size: 1.125rem;
        height: 30px;

        transition: 0.15s opacity;
      }

      .features .container {
        max-width: 100vw;
      }

      p.features--hint {
        text-align: center;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.5);
        margin: 0;
        margin-top: 7px;
      }
    </style>

    <link
      rel="preload"
      href="style.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="style.css" /></noscript>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </head>
